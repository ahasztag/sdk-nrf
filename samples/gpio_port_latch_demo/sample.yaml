sample:
  description: Demonstrate GPIO PORT/LATCH callbacks on shared port
  name: GPIO port latch demo

tests:
  sample.peripheral.gpio_port_latch_demo:
    build_only: true
    integration_platforms:
      - nrf54ls05dk/nrf54ls05b/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    platform_allow:
      - nrf54ls05dk/nrf54ls05a/cpuapp
      - nrf54ls05dk/nrf54ls05b/cpuapp
      - nrf54l15dk/nrf54l05/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - ci_build
      - sysbuild
